<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polysense | Premium PCOS Detection</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Global Styles -->
    <link rel="stylesheet" href="/static/style.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar glass-card">
        <a href="/" class="brand">
            <i data-lucide="activity" style="color: var(--primary);"></i>
            <span>Polysense</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="#about" class="nav-link">About PCOS</a>
            <a href="/test" class="btn-primary">
                <i data-lucide="check-circle"></i>
                Take the Test
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="glass-card" style="margin: 40px auto; width: 90%; max-width: 1200px;">
        <div class="footer-links" style="padding-top: 20px;">
            <a href="/">Home</a>
            <a href="/test">Prediction</a>
            <a href="#about">Resources</a>
        </div>
        <p>&copy; 2026 Polysense. This platform is for educational and screening purposes only. Always consult a medical professional.</p>
        <div style="margin-top: 10px; font-size: 0.8rem;">
            Made with <i data-lucide="heart" style="width: 12px; height: 12px; display: inline; vertical-align: middle; color: var(--primary);"></i> for better health.
        </div>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
        
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                nav.style.padding = '10px 30px';
                nav.style.background = 'rgba(255, 255, 255, 0.9)';
            } else {
                nav.style.padding = '15px 30px';
                nav.style.background = 'rgba(255, 255, 255, 0.7)';
            }
        });
    </script>
</body>
</html>
